[package]
name = "boneyard"
version = "0.1.0"
description = "BONEYARD — neon gladiator roguelite"
edition = "2021"
rust-version = "1.88"

[lib]
name = "boneyard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "boneyard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
