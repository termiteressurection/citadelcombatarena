[package]
name = "citadel"
version = "0.1.3"
description = "Citadel — System Presence"
authors = ["Citadel Team"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "citadel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "citadel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["std"] }
zeroize = "1"
oxigraph = { version = "0.4.11", features = ["rocksdb"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
blake3 = "1"
sha2 = "0.10"
aes-gcm = "0.10"
pbkdf2 = "0.12"
base64 = "0.22"
snow = "0.9"
hex = "0.4"
get_if_addrs = "0.5"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
chrono = { version = "0.4", features = ["clock"] }
window-vibrancy = "0.5"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "coreml", "download-binaries"] }
unicode-normalization = "0.1"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
llama-cpp-2 = { version = "0.1.160", features = ["metal"] }

[patch.crates-io]
# Oxigraph 0.4's parser crates constrain quick-xml to the vulnerable 0.37 line.
# These source-identical local copies keep the parser implementations while
# allowing patched quick-xml 0.41 until upstream widens its dependency ranges.
oxrdfxml = { path = "vendor/oxrdfxml" }
sparesults = { path = "vendor/sparesults" }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = false
